name: heartbeat

# Secondary keep-alive for the Render free-tier backend. Best-effort only — it
# ALWAYS exits 0 so GitHub never emails a failure or auto-cancels the schedule.
# The primary pinger should be an external service (e.g. cron-job.org) that
# doesn't disable itself after repo inactivity. server/jobs/heartbeat.js catches
# up any missed jobs on the next request regardless.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /tick (best effort)
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/out -w '%{http_code}' --max-time 60 https://axiom-u58i.onrender.com/tick || echo 000)
            echo "attempt $i -> HTTP $code"; cat /tmp/out 2>/dev/null; echo
            [ "$code" = "200" ] && break
            sleep 30
          done
          exit 0
